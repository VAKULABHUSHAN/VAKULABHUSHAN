name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches: [ main ]
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write             # REQUIRED — see note below

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: VAKULABHUSHAN
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ── If the snake still doesn't show after this runs ──────────────────────────
# 1. Go to Settings → Actions → General → "Workflow permissions" and select
#    "Read and write permissions", then Save. This is OFF by default on new
#    repos and silently breaks the push to the output branch.
# 2. Go to the Actions tab and confirm the "generate snake" run is green.
#    If it's red, open the log — it'll usually point at the permissions issue.
# 3. After a successful run, check that an "output" branch now exists in the
#    repo, containing dist/github-contribution-grid-snake-dark.svg.
# 4. Confirm the README image URL branch matches exactly:
#    .../VAKULABHUSHAN/VAKULABHUSHAN/output/github-contribution-grid-snake-dark.svg
